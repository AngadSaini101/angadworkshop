<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Before-and-after project gallery">
  <title>Before &amp; After Gallery</title>

  <style>
    :root {
      --background: #f7f5f0;
      --surface: #ffffff;
      --text: #20241f;
      --muted: #687068;
      --accent: #57745a;
      --border: #e8e7e0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .page-header {
      padding: 60px 20px 40px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.3rem, 6vw, 4rem);
      font-weight: 500;
    }

    .intro {
      max-width: 570px;
      margin: 14px auto 0;
      color: var(--muted);
    }

    /* Wider page so the photos can be larger */
    main {
      width: min(1400px, calc(100% - 40px));
      margin: 0 auto 60px;
    }

    .project {
      margin-bottom: 40px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgb(35 41 32 / 5%);
    }

    .project-header { margin-bottom: 26px; }

    .project-header h2 {
      margin: 0 0 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.9rem;
      font-weight: 500;
    }

    .project-header p {
      margin: 0;
      color: var(--muted);
    }

    /* Before on top, After below (stacked in one column) */
    .galleries {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }

    .gallery-group { min-width: 0; }

    .gallery-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      font-size: 1.1rem;
    }

    .gallery-heading span {
      padding: 5px 10px;
      border-radius: 999px;
      background: #edf1e9;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

figure {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  margin: 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
}


.photo-wrap {
  aspect-ratio: 3 / 2;
  flex-shrink: 0;
  overflow: hidden;
  background: #e5e3dc;
}

.photo-wrap img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 250ms ease;
}

    figure:hover img { transform: scale(1.04); }

figcaption {
  padding: 14px 16px;
  flex-grow: 1;
}

    figcaption h4 {
      margin: 0 0 5px;
      font-size: 1rem;
    }

    figcaption p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      padding: 0 20px 28px;
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
    }

    @media (max-width: 760px) {
      main { width: min(100% - 28px, 1400px); }
      .photo-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 430px) {
      .project { padding: 16px; }
    }
  </style>
</head>

<body>
